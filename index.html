        <!-- Vercel Web Analytics (sin cookies). Para excluir tus pruebas en este
       navegador: abre ?va-disable=1 (apagar) o ?va-disable=0 (reactivar). -->
        <script>
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.get('va-disable') === '1') localStorage.setItem('va-disable', '1');
      if (p.get('va-disable') === '0') localStorage.removeItem('va-disable');
      if (localStorage.getItem('va-disable') !== '1') {
        var s = document.createElement('script');
        s.defer = true; s.src = '/_vercel/insights/script.js';
        document.head.appendChild(s);
      }
    })();
  </script>
        <!-- Rastreo per-lead (cookieless): si la URL trae ?lead=XX, lo registra en
       la hoja "Visitas" vía Apps Script. Solo una vez por sesión. No bloquea
       la página ni afecta nada si Apps Script no responde. -->
        <script>
    (function () {
      try {
        var lead = new URLSearchParams(location.search).get('lead');
        if (!lead) return;
        var key = 'lead-logged-' + lead;
        if (sessionStorage.getItem(key)) return;   // evita duplicar al refrescar
        sessionStorage.setItem(key, '1');
        fetch('https://script.google.com/macros/s/AKfycbzk9nv_x1ncl_PdLyjwC1J-uV1TU9PLLIaTNcBi-fVVUdqzJeY3x3mQJg_5VuQIZ3BeTQ/exec', {
          method: 'POST',
          body: JSON.stringify({ action: 'logVisit', lead: lead })
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
