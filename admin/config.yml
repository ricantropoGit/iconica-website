# =========================================================================
# Panel de edición (Decap CMS) — grfkweb.com/admin
# -------------------------------------------------------------------------
# Cada campo de aquí es algo que el cliente puede cambiar. Lo que no está
# aquí (diseño, colores, íconos, estructura) no se puede tocar desde el
# panel. Los textos se guardan en contenido/inicio.json y el build de Vercel
# los mete en index.html (scripts/contenido.mjs).
#
# Al guardar, Decap hace un commit en main → Vercel publica en 1-2 minutos.
# =========================================================================
backend:
  name: github
  repo: ricantropoGit/iconica-website
  branch: main
  # Inicio de sesión con usuario y contraseña (api/auth.js) y todas las
  # llamadas a GitHub por el intermediario api/github.js. El editor nunca
  # tiene una llave de GitHub: ver api/_cms.js.
  base_url: https://grfkweb.com
  auth_endpoint: api/auth
  api_root: /api/github
  commit_messages:
    update: "Contenido: actualiza {{slug}} desde el panel"
    uploadMedia: "Contenido: sube {{path}}"
    deleteMedia: "Contenido: borra {{path}}"

# Para probar en local sin GitHub: `npx decap-server` y abrir /admin.
local_backend: true

locale: es
# Logotipo en la pantalla de entrada (en lugar del de Decap)
logo_url: /apple-touch-icon.png
site_url: https://grfkweb.com
display_url: https://grfkweb.com

media_folder: images/cms
public_folder: /images/cms

collections:
  - name: paginas
    label: Páginas
    delete: false
    files:
      - name: inicio
        label: Inicio
        file: contenido/inicio.json
        fields:
          - label: Buscadores y redes sociales
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ['^.{1,70}$', "Máximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ['^[\s\S]{1,170}$', "Máximo 170 caracteres"] }
              - { label: "Título al compartir el enlace", name: titulo_compartir, widget: string }
              - { label: "Descripción al compartir el enlace", name: descripcion_compartir, widget: text }

          - label: Portada
            name: hero
            widget: object
            fields:
              - { label: "Título principal", name: titulo, widget: string, pattern: ['^.{1,90}$', "Máximo 90 caracteres para que no se rompa la portada"] }
              - { label: "Subtítulo", name: subtitulo, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - { label: "Botón principal", name: boton_principal, widget: string, pattern: ['^.{1,30}$', "Máximo 30 caracteres"] }
              - { label: "Botón secundario", name: boton_secundario, widget: string, pattern: ['^.{1,30}$', "Máximo 30 caracteres"] }

          - label: Cómo funciona
            name: pasos
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string, hint: "La llamada a nota 1 va fija después del título" }
              - { label: "Texto", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "Tarjetas"
                name: tarjetas
                widget: list
                # Cada tarjeta tiene su ícono fijo en el diseño: se editan,
                # pero no se agregan, quitan ni reordenan.
                allow_add: false
                allow_remove: false
                allow_reorder: false
                summary: "{{fields.etiqueta}} — {{fields.titulo}}"
                fields:
                  - { label: "Etiqueta", name: etiqueta, widget: string }
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Texto", name: texto, widget: text }
              - { label: "Botón", name: boton, widget: string, pattern: ['^.{1,40}$', "Máximo 40 caracteres"] }

          - label: Ventajas
            name: ventajas
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "Tarjetas"
                name: tarjetas
                widget: list
                allow_add: false
                allow_remove: false
                allow_reorder: false
                summary: "{{fields.etiqueta}} — {{fields.titulo}}"
                fields:
                  - { label: "Etiqueta", name: etiqueta, widget: string }
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Texto", name: texto, widget: text }

          - label: Llamada a la acción (bloque oscuro)
            name: cta
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text, hint: "Formato: `**negritas**` · `^1^` para una llamada a nota" }
              - { label: "Botón principal", name: boton_principal, widget: string }
              - { label: "Botón secundario", name: boton_secundario, widget: string }
              - { label: "Nota inferior", name: nota, widget: string }

          - label: Precios
            name: precios
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta superior", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: string }
              - label: "Planes"
                name: planes
                widget: list
                # Cada tarjeta tiene su tipo: el diseño sale del tipo (no de la
                # posición) y el formulario muestra sólo sus campos. Se pueden
                # reacomodar: el orden de la lista es el orden en pantalla.
                hint: "Arrastra las tarjetas para cambiar su orden (la primera va a la izquierda y arriba en celular)."
                allow_add: false
                allow_remove: false
                typeKey: tipo
                types:
                  - label: "Tarjeta de contado"
                    name: fijo
                    widget: object
                    summary: "{{fields.nombre}} — {{fields.precio}}"
                    fields:
                      - { label: "Insignia (vacío = sin insignia)", name: insignia, widget: string, required: false }
                      - { label: "Nombre del plan", name: nombre, widget: string }
                      - { label: "Precio", name: precio, widget: string, hint: "Ej. $499" }
                      - { label: "Periodo", name: periodo, widget: string, hint: "Ej. MX/mes" }
                      - { label: "Forma de cobro", name: cobro, widget: string }
                      - { label: "Qué incluye", name: caracteristicas, widget: list, field: { label: "Punto", name: punto, widget: string }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                      - { label: "Texto del botón", name: boton, widget: string }
                      - { label: "Enlace de pago", name: enlace, widget: string, pattern: ['^https://', "Debe empezar con https://"] }
                  - label: "Tarjeta destacada (con plazos)"
                    name: plazos
                    widget: object
                    summary: "Total {{fields.total}}"
                    fields:
                      - { label: "Insignia (vacío = sin insignia)", name: insignia, widget: string, required: false }
                      - label: "Plazos"
                        name: plazos
                        widget: list
                        min: 1
                        summary: "{{fields.meses}} meses — {{fields.precio}}"
                        hint: "Opciones del selector. Sale elegido el último de la lista."
                        fields:
                          - { label: "Meses", name: meses, widget: string, pattern: ['^\d+$', "Sólo el número, p. ej. 12"] }
                          - { label: "Precio por mes", name: precio, widget: string, hint: "Ej. $825" }
                      - { label: "Total", name: total, widget: string, hint: "Ej. $9,900. Debajo del precio se lee: «12 pagos de $825 — total $9,900»" }
                      - { label: "Periodo", name: periodo, widget: string, hint: "Ej. MX/mes" }
                      - { label: "Qué incluye", name: caracteristicas, widget: list, field: { label: "Punto", name: punto, widget: string }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                      - { label: "Texto del botón", name: boton, widget: string }
                      - { label: "Enlace de pago", name: enlace, widget: string, pattern: ['^https://', "Debe empezar con https://"] }
              - { label: "Nota al pie", name: nota, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }

          - label: Tabla comparativa
            name: compara
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto bajo el título", name: texto, widget: string }
              - label: "Columna 1 (destacada)"
                name: col1
                widget: object
                collapsed: true
                fields:
                  - { label: "Nombre", name: nombre, widget: string }
                  - { label: "Etiqueta (vacío = sin etiqueta)", name: etiqueta, widget: string, required: false }
              - { label: "Columna 2", name: col2, widget: object, collapsed: true, fields: [{ label: "Nombre", name: nombre, widget: string }] }
              - { label: "Columna 3", name: col3, widget: object, collapsed: true, fields: [{ label: "Nombre", name: nombre, widget: string }] }
              - label: "Filas"
                name: filas
                label_singular: fila
                widget: list
                summary: "{{fields.caracteristica}}"
                hint: "Arrastra para ordenarlas. En cada celda eliges ✓, — o un texto."
                fields:
                  - { label: "Característica", name: caracteristica, widget: string, hint: "Formato: `**negritas**` · `^1^` superíndice" }
                  - { label: "Fila de costo (resaltada)", name: costo, widget: boolean, default: false, required: false }
                  - label: "Columna 1"
                    name: col1
                    widget: object
                    collapsed: false
                    summary: "{{fields.tipo}} {{fields.texto}}"
                    fields:
                      - { label: "Celda", name: tipo, widget: select, default: si, options: [{ label: "✓  Sí", value: si }, { label: "—  No", value: no }, { label: "Texto", value: texto }] }
                      - { label: "Texto (si elegiste Texto)", name: texto, widget: string, required: false, hint: "Sale en negritas, p. ej. $9,000 a $27,000" }
                  - label: "Columna 2"
                    name: col2
                    widget: object
                    collapsed: false
                    summary: "{{fields.tipo}} {{fields.texto}}"
                    fields:
                      - { label: "Celda", name: tipo, widget: select, default: si, options: [{ label: "✓  Sí", value: si }, { label: "—  No", value: no }, { label: "Texto", value: texto }] }
                      - { label: "Texto (si elegiste Texto)", name: texto, widget: string, required: false, hint: "Sale en negritas, p. ej. $9,000 a $27,000" }
                  - label: "Columna 3"
                    name: col3
                    widget: object
                    collapsed: false
                    summary: "{{fields.tipo}} {{fields.texto}}"
                    fields:
                      - { label: "Celda", name: tipo, widget: select, default: si, options: [{ label: "✓  Sí", value: si }, { label: "—  No", value: no }, { label: "Texto", value: texto }] }
                      - { label: "Texto (si elegiste Texto)", name: texto, widget: string, required: false, hint: "Sale en negritas, p. ej. $9,000 a $27,000" }

          - label: Preguntas frecuentes
            name: faq
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - label: "Preguntas"
                name: preguntas
                widget: list
                summary: "{{fields.pregunta}}"
                fields:
                  - { label: "Pregunta", name: pregunta, widget: string }
                  - { label: "Respuesta", name: respuesta, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }

          - label: Contacto
            name: contacto
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - { label: "WhatsApp (como se muestra)", name: whatsapp, widget: string }
              - { label: "Ubicación", name: ubicacion, widget: string }

          - label: Notas al pie
            name: notas
            widget: object
            collapsed: true
            fields:
              - { label: "Notas", name: lista, widget: list, label_singular: nota, field: { label: "Nota", name: nota, widget: text }, hint: "Se numeran solas en el orden de la lista: la primera es la 1, y así. Los superíndices de la página (^1^, ^2^…) llevan a la nota con ese número; si cambias el orden, revísalos. Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
      - name: servicios
        label: "Servicios"
        file: contenido/servicios.json
        fields:
          - label: "Buscadores"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ["^.{1,70}$", "M\u00e1ximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ["^[\\s\\S]{1,170}$", "M\u00e1ximo 170 caracteres"] }
          - label: "Encabezado"
            name: encabezado
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Incluido en tu plan"
            name: incluido
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - label: "Servicios incluidos"
                name: servicios
                widget: list
                # Cada uno tiene su ícono fijo en el diseño: se editan, pero no se agregan ni quitan.
                allow_add: false
                allow_remove: false
                allow_reorder: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Texto", name: texto, widget: text }
          - label: "Servicios adicionales"
            name: extras
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - label: "Grupos"
                name: grupos
                widget: list
                label_singular: grupo
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título del grupo", name: titulo, widget: string }
                  - { label: "Nota bajo el título", name: nota, widget: string, required: false, hint: "Opcional." }
                  - label: "Servicios"
                    name: servicios
                    widget: list
                    label_singular: servicio
                    summary: "{{fields.servicio}} — {{fields.precio}}"
                    fields:
                      - { label: "Servicio", name: servicio, widget: string }
                      - { label: "Precio", name: precio, widget: string, hint: "Ej.: $1,800 · Desde $6,500 · Según Plan ^1^" }
          - label: "Notas al pie"
            name: notas
            widget: object
            collapsed: true
            fields:
              - { label: "Aviso «No ofrecemos»", name: aviso, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - { label: "Notas", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Llamada final"
            name: cta
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Botón", name: boton, widget: string }
              - { label: "Enlace del botón", name: enlace, widget: string, hint: "Ej.: index.html#contacto" }
      - name: success
        label: "Después del pago (success)"
        file: contenido/success.json
        fields:
          - label: "Buscadores"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ["^.{1,70}$", "M\u00e1ximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ["^[\\s\\S]{1,170}$", "M\u00e1ximo 170 caracteres"] }
          - label: "Encabezado"
            name: encabezado
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Pasos"
            name: pasos
            widget: list
            # Los cuatro pasos son fijos en el diseño (el 3 lleva la tabla DNS).
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Tabla DNS (paso 3)"
            name: dns
            widget: object
            collapsed: true
            fields:
              - { label: "IP del servidor (registro A)", name: ip, widget: string, hint: "OJO: si cambia el servidor, avisa a todos los clientes cuyo dominio apunta aquí." }
              - { label: "Valor del CNAME (www)", name: cname, widget: string }
              - { label: "Nota bajo la tabla", name: nota, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "WhatsApp y nota final"
            name: cierre
            widget: object
            collapsed: true
            fields:
              - { label: "Texto del botón", name: boton, widget: string }
              - { label: "Enlace de WhatsApp", name: enlace, widget: string, hint: "https://wa.me/52…?text=…" }
              - { label: "Nota", name: nota, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
      - name: privacidad
        label: "Aviso de privacidad"
        file: contenido/privacidad.json
        fields:
          - label: "Buscadores"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ["^.{1,70}$", "M\u00e1ximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ["^[\\s\\S]{1,170}$", "M\u00e1ximo 170 caracteres"] }
          - label: "Encabezado"
            name: encabezado
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Última actualización", name: actualizado, widget: string }
          - { label: "Introducción", name: intro, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Secciones"
            name: secciones
            widget: object
            collapsed: true
            fields:
              - label: "1. Datos personales que recabamos"
                name: s1
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Recuadro destacado", name: destacado, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "2. Finalidades del tratamiento de sus datos personales"
                name: s2
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Párrafo 2", name: parrafo_2, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "3. Plazos de conservación y supresión de datos"
                name: s3
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "4. Transferencia de datos personales"
                name: s4
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Párrafo 2", name: parrafo_2, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "5. Derechos ARCO y revocación del consentimiento"
                name: s5
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Párrafo 2", name: parrafo_2, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "6. Seguridad y confidencialidad"
                name: s6
                widget: object
                collapsed: true
