# =========================================================================
# Panel de edición (Decap CMS) — grfkweb.com/admin
# -------------------------------------------------------------------------
# Cada campo de aquí es algo que el cliente puede cambiar. Lo que no está
# aquí (diseño, colores, íconos, estructura) no se puede tocar desde el
# panel. Los textos se guardan en contenido/inicio.json y el build de Vercel
# los mete en index.html (scripts/contenido.mjs).
#
# Al guardar, Decap hace un commit en main → Vercel publica en 1-2 minutos.
# =========================================================================
backend:
  name: github
  repo: ricantropoGit/iconica-website
  branch: main
  # Inicio de sesión con usuario y contraseña (api/auth.js) y todas las
  # llamadas a GitHub por el intermediario api/github.js. El editor nunca
  # tiene una llave de GitHub: ver api/_cms.js.
  base_url: https://grfkweb.com
  auth_endpoint: api/auth
  api_root: /api/github
  commit_messages:
    update: "Contenido: actualiza {{slug}} desde el panel"
    uploadMedia: "Contenido: sube {{path}}"
    deleteMedia: "Contenido: borra {{path}}"

# Para probar en local sin GitHub: `npx decap-server` y abrir /admin.
local_backend: true

locale: es
# Logotipo en la pantalla de entrada (en lugar del de Decap)
logo_url: /apple-touch-icon.png
site_url: https://grfkweb.com
display_url: https://grfkweb.com

# Direcciones de páginas nuevas sin acentos ni signos: «Página de prueba» → pagina-de-prueba
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_folder: images/cms
public_folder: /images/cms

collections:
  # Páginas fijas del sitio (cada una con su .html). La de inicio se arma
  # con bloques (bloques/<tipo>/); las demás tienen sus campos aquí.
  - name: fijas
    label: Páginas
    delete: false
    files:
      - name: inicio
        label: Inicio
        file: contenido/inicio.json
        fields:
          - label: Buscadores y redes sociales
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ['^.{1,70}$', "Máximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ['^[\s\S]{1,170}$', "Máximo 170 caracteres"] }
              - { label: "Título al compartir el enlace", name: titulo_compartir, widget: string }
              - { label: "Descripción al compartir el enlace", name: descripcion_compartir, widget: text }

          - label: Bloques
            name: bloques
            label_singular: bloque
            widget: list
            typeKey: tipo
            collapsed: true
            hint: "Agrega, quita, ordena u oculta las secciones de la página. Cada bloque trae su diseño; sólo cambias el contenido."
            # Los tipos de bloque salen de bloques/<tipo>/campos.json: el build los pone aquí.
            types: "@bloques"
      - name: servicios
        label: "Servicios"
        file: contenido/servicios.json
        fields:
          - label: "Buscadores"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ["^.{1,70}$", "M\u00e1ximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ["^[\\s\\S]{1,170}$", "M\u00e1ximo 170 caracteres"] }
          - label: "Encabezado"
            name: encabezado
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
          - label: "Incluido en tu plan"
            name: incluido
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - label: "Servicios incluidos"
                name: servicios
                widget: list
                # Cada uno tiene su ícono fijo en el diseño: se editan, pero no se agregan ni quitan.
                allow_add: false
                allow_remove: false
                allow_reorder: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Texto", name: texto, widget: text }
          - label: "Servicios adicionales"
            name: extras
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - label: "Grupos"
                name: grupos
                widget: list
                label_singular: grupo
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título del grupo", name: titulo, widget: string }
                  - { label: "Nota bajo el título", name: nota, widget: string, required: false, hint: "Opcional." }
                  - label: "Servicios"
                    name: servicios
                    widget: list
                    label_singular: servicio
                    summary: "{{fields.servicio}} — {{fields.precio}}"
                    fields:
                      - { label: "Servicio", name: servicio, widget: string }
                      - { label: "Precio", name: precio, widget: string, hint: "Ej.: $1,800 · Desde $6,500 · Según Plan ^1^" }
          - label: "Notas al pie"
            name: notas
            widget: object
            collapsed: true
            fields:
              - { label: "Aviso «No ofrecemos»", name: aviso, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - { label: "Notas", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Llamada final"
            name: cta
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Botón", name: boton, widget: string }
              - { label: "Enlace del botón", name: enlace, widget: string, hint: "Ej.: index.html#contacto" }
      - name: success
        label: "Después del pago (success)"
        file: contenido/success.json
        fields:
          - label: "Buscadores"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ["^.{1,70}$", "M\u00e1ximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ["^[\\s\\S]{1,170}$", "M\u00e1ximo 170 caracteres"] }
          - label: "Encabezado"
            name: encabezado
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Pasos"
            name: pasos
            widget: list
            # Los cuatro pasos son fijos en el diseño (el 3 lleva la tabla DNS).
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Tabla DNS (paso 3)"
            name: dns
            widget: object
            collapsed: true
            fields:
              - { label: "IP del servidor (registro A)", name: ip, widget: string, hint: "OJO: si cambia el servidor, avisa a todos los clientes cuyo dominio apunta aquí." }
              - { label: "Valor del CNAME (www)", name: cname, widget: string }
              - { label: "Nota bajo la tabla", name: nota, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "WhatsApp y nota final"
            name: cierre
            widget: object
            collapsed: true
            fields:
              - { label: "Texto del botón", name: boton, widget: string }
              - { label: "Enlace de WhatsApp", name: enlace, widget: string, hint: "https://wa.me/52…?text=…" }
              - { label: "Nota", name: nota, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
      - name: privacidad
        label: "Aviso de privacidad"
        file: contenido/privacidad.json
        fields:
          - label: "Buscadores"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Título de la pestaña", name: titulo, widget: string, pattern: ["^.{1,70}$", "M\u00e1ximo 70 caracteres"] }
              - { label: "Descripción en Google", name: descripcion, widget: text, pattern: ["^[\\s\\S]{1,170}$", "M\u00e1ximo 170 caracteres"] }
          - label: "Encabezado"
            name: encabezado
            widget: object
            collapsed: true
            fields:
              - { label: "Etiqueta", name: etiqueta, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Última actualización", name: actualizado, widget: string }
          - { label: "Introducción", name: intro, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Secciones"
            name: secciones
            widget: object
            collapsed: true
            fields:
              - label: "1. Datos personales que recabamos"
                name: s1
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Recuadro destacado", name: destacado, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "2. Finalidades del tratamiento de sus datos personales"
                name: s2
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Párrafo 2", name: parrafo_2, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "3. Plazos de conservación y supresión de datos"
                name: s3
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "4. Transferencia de datos personales"
                name: s4
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Párrafo 2", name: parrafo_2, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "5. Derechos ARCO y revocación del consentimiento"
                name: s5
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Párrafo 2", name: parrafo_2, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "6. Seguridad y confidencialidad"
                name: s6
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Viñetas", name: puntos, widget: list, label_singular: viñeta, field: { label: "Viñeta", name: punto, widget: text }, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Párrafo 2", name: parrafo_2, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "7. Cambios al Aviso de Privacidad"
                name: s7
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
              - label: "8. Consentimiento y contacto"
                name: s8
                widget: object
                collapsed: true
                fields:
                  - { label: "Título", name: titulo, widget: string }
                  - { label: "Párrafo 1", name: parrafo_1, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
                  - { label: "Párrafo 2", name: parrafo_2, widget: text, hint: "Formato: `==resaltado==` · `**negritas**` · `[texto del enlace](https://…)`" }
          - label: "Contacto de privacidad"
            name: contacto
            widget: object
            collapsed: true
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Correo", name: correo, widget: string }
              - { label: "Domicilio", name: domicilio, widget: string, hint: "Incluye la palabra «Domicilio:»." }

  # Páginas nuevas que crea el cliente, armadas con los mismos bloques que
  # inicio. Se publican en /<nombre>/ con el molde de index.html.
  - name: paginas
    label: Páginas nuevas
    label_singular: página
    description: "Páginas nuevas del sitio, armadas con los mismos bloques que inicio. Para que aparezcan en el menú, agrega en «Menú y sitio» una opción con su dirección (/nombre/)."
    folder: contenido/paginas
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: titulo
    slug: "{{slug}}"
    summary: "{{titulo}}"
    fields:
      - { label: "Título de la página", name: titulo, widget: string, pattern: ['^.{1,60}$', "Máximo 60 caracteres"], hint: "Al crear la página, de aquí sale su dirección: «Nuestros servicios» → /nuestros-servicios/. Después la dirección ya no cambia." }
      - label: Buscadores y redes sociales
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { label: "Título de la pestaña", name: titulo, widget: string, required: false, hint: "Vacío = «Título de la página · GraphicaWeb».", pattern: ['^.{0,70}$', "Máximo 70 caracteres"] }
          - { label: "Descripción en Google", name: descripcion, widget: text, required: false, pattern: ['^[\s\S]{0,170}$', "Máximo 170 caracteres"] }
          - { label: "Título al compartir el enlace", name: titulo_compartir, widget: string, required: false, hint: "Vacío = el título de la pestaña." }
          - { label: "Descripción al compartir el enlace", name: descripcion_compartir, widget: text, required: false, hint: "Vacío = la descripción en Google." }
      - label: Bloques
        name: bloques
        label_singular: bloque
        widget: list
        typeKey: tipo
        collapsed: true
        hint: "Agrega, quita, ordena u oculta las secciones de la página. Cada bloque trae su diseño; sólo cambias el contenido."
        types: "@bloques"

  # Menú y pie: los comparten todas las páginas (el build los pone en cada
  # una). Fuera de inicio, los #ancla del menú llevan a inicio (/#precios).
  - name: sitio
    label: Menú y pie
    delete: false
    files:
      - name: sitio
        label: Menú y pie
        file: contenido/sitio.json
        fields:
          - { label: "Nombre en la cabecera", name: nombre, widget: string, hint: "Junto al símbolo Ø." }
          - label: Menú
            name: menu
            label_singular: opción
            widget: list
            max: 8
            summary: "{{fields.texto}}"
            hint: "Arrastra para ordenarlas. Si no caben en la cabecera, el menú pasa solo a la hamburguesa."
            fields:
              - { label: "Texto", name: texto, widget: string, pattern: ['^.{1,24}$', "Máximo 24 caracteres"] }
              - { label: "Dirección", name: enlace, widget: string, hint: "#ancla de una sección de inicio (p. ej. #precios), /servicios.html o https://…", pattern: ['^(#[a-z0-9-]+|/.*|https?://.+|mailto:.+|tel:.+)$', "Empieza con #, / o https://"] }
          - label: Pie
            name: pie
            widget: object
            collapsed: true
            fields:
              - { label: "Texto legal", name: legal, widget: string, hint: "Va después de «© año»." }
