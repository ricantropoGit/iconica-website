<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="robots" content="noindex, nofollow"/>
        <title>Icónica24 — Editor de contenido</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
        <!-- Ruta absoluta de la configuración. Sin esto Decap la busca junto a
             la página: en /admin (sin diagonal final) pedía /config.yml → 404. -->
        <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url"/>
    </head>
    <body>
        <!-- Panel de edición (Decap CMS). La configuración está en config.yml,
             junto a este archivo. Versión fija para que una actualización de
             Decap no cambie el panel sin que lo sepamos. -->
        <script>window.CMS_MANUAL_INIT = true;</script>
        <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
        <!-- El español de Decap deja algunos textos en inglés ("Add …",
             "Insert from URL"): se completan antes de iniciar, sin tocar los
             que ya trae. La configuración se sigue leyendo de config.yml. -->
        <script>
            (function () {
                function completar(a, b) {
                    Object.keys(b).forEach(function (k) {
                        if (b[k] && typeof b[k] === 'object') a[k] = completar(a[k] || {}, b[k]);
                        else if (!(k in a)) a[k] = b[k];
                    });
                    return a;
                }
                CMS.registerLocale('es', completar(CMS.getLocale('es') || {}, { editor: { editorWidgets: {
                    list: { add: 'Añadir %{item}', addType: 'Añadir %{item}' },
                    image: { chooseUrl: 'Insertar desde URL', replaceUrl: 'Reemplazar con URL' },
                    file: { chooseUrl: 'Insertar desde URL', replaceUrl: 'Reemplazar con URL' },
                } } }));
            })();
            CMS.init();
        </script>
        <!-- El editor entra con usuario y contraseña (api/auth.js), no con
             GitHub: se quita "con GitHub" y el logo del botón de entrada. -->
        <script>
            new MutationObserver(function () {
                document.querySelectorAll('button').forEach(function (b) {
                    if (!/con GitHub|with GitHub/i.test(b.textContent)) return;
                    b.querySelectorAll('svg').forEach(function (i) { (i.parentElement === b ? i : i.parentElement).style.display = 'none'; });
                    b.childNodes.forEach(function (n) {
                        if (n.nodeType === 3) n.textContent = n.textContent.replace(/\s*(con|with) GitHub/i, '');
                    });
                });
            }).observe(document.documentElement, { childList: true, subtree: true });
        </script>
        <!-- Vista previa con el diseño real del sitio (botón del ojo) -->
        <script type="module" src="/admin/vista-previa.js"></script>
    </body>
</html>
